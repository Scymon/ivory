<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ivory</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./canvas.css" />
    <style>
      .workspace,
      .workspace-body,
      .editor-host,
      .reading-host,
      .canvas-host {
        min-height: 0;
        min-width: 0;
      }

      .workspace-body {
        height: 100%;
        overflow: hidden;
      }

      .editor-host {
        height: 100%;
        overflow: hidden;
      }

      .editor-host > .cm-editor {
        height: 100%;
        max-height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .editor-host .cm-scroller {
        flex: 1 1 auto;
        min-height: 0;
        height: 100%;
        overflow: auto;
      }

      .reading-host {
        height: 100%;
        max-height: 100%;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./renderer.js"></script>
    <script type="module" src="./canvas.js"></script>
  </body>
</html>
