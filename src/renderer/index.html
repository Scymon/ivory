<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ivory</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./canvas.css" />
    <link rel="stylesheet" href="./image-viewer.css" />
    <link rel="stylesheet" href="./bases.css" />
    <style>
      .workspace,
      .workspace-body,
      .editor-host,
      .reading-host,
      .canvas-host,
      .image-viewer-host,
      .bases-host {
        min-height: 0;
        min-width: 0;
      }

      .workspace-body {
        height: 100%;
        overflow: hidden;
      }

      .editor-host {
        height: 100%;
        overflow: hidden;
      }

      .editor-host > .cm-editor {
        height: 100%;
        max-height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .editor-host .cm-scroller {
        flex: 1 1 auto;
        min-height: 0;
        height: 100%;
        overflow: auto;
      }

      .reading-host {
        height: 100%;
        max-height: 100%;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      await import('./renderer.js');
      await import('./workspace-router.js');
      await import('./native-reopen-guard.js');
      await import('./document-sync.js');
      await import('./open-path.js');
      await import('./canvas.js');
      await import('./canvas-markdown.js');
      await import('./image-viewer.js');
      await import('./bases.js');
      await import('./base-prompt-bridge.js');
      await import('./base-create-note.js');
    </script>
  </body>
</html>
